<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Satva</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body class="admin-page">
    <div class="admin-container">
        <nav id="admin-nav" class="admin-nav" aria-label="Навигация админки">
            <div class="admin-nav__tabs">
                <button type="button" id="admin-nav-leads" class="admin-nav__tab admin-nav__tab--active" data-nav="leads">Заявки</button>
                <button type="button" id="admin-nav-settings" class="admin-nav__tab" data-nav="settings">Настройки</button>
            </div>
            <button type="button" id="admin-logout" class="admin-btn admin-btn--secondary admin-btn--small">Выйти</button>
        </nav>

        <!-- 1. Блок входа -->
        <section id="admin-login" class="admin-block">
            <h1>Вход в админку</h1>
            <form id="admin-login-form" class="admin-login-form">
                <div class="form-group">
                    <label for="admin-email">Email</label>
                    <input type="email" id="admin-email" name="email" class="form-input" required autocomplete="email" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label for="admin-password">Пароль</label>
                    <input type="password" id="admin-password" name="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Войти</button>
                <div id="admin-login-message" class="form-message" role="alert" aria-live="polite"></div>
            </form>
        </section>

        <!-- 2. Блок списка заявок -->
        <section id="admin-leads" class="admin-block admin-hidden">
            <div class="admin-leads-header">
                <h1>Заявки</h1>
                <div class="admin-toolbar">
                    <label for="admin-leads-filter" class="visually-hidden">Фильтр по типу</label>
                    <select id="admin-leads-filter" class="admin-filter-select" aria-label="Фильтр по типу заявки">
                        <option value="">Все</option>
                        <option value="contact">contact</option>
                        <option value="procedure_booking">procedure_booking</option>
                        <option value="package_choice">package_choice</option>
                    </select>
                    <div class="admin-date-filters" role="group" aria-label="Фильтр по дате создания">
                        <label class="admin-date-label">с <input type="datetime-local" id="admin-date-from" class="admin-date-input"></label>
                        <label class="admin-date-label">по <input type="datetime-local" id="admin-date-to" class="admin-date-input"></label>
                        <button type="button" id="admin-apply-filters" class="admin-btn admin-btn--small">Применить</button>
                        <button type="button" id="admin-clear-dates" class="admin-btn admin-btn--small admin-btn--secondary">Сбросить даты</button>
                    </div>
                </div>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table" role="grid" aria-label="Список заявок">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Тип</th>
                            <th>Имя</th>
                            <th>Телефон</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="admin-leads-tbody">
                        <tr><td colspan="5">Загрузка…</td></tr>
                    </tbody>
                </table>
            </div>
            <nav class="admin-pagination" aria-label="Пагинация">
                <button type="button" id="admin-pagination-prev" class="admin-btn admin-btn--secondary">Назад</button>
                <span id="admin-pagination-info" aria-live="polite">—</span>
                <button type="button" id="admin-pagination-next" class="admin-btn admin-btn--secondary">Вперёд</button>
            </nav>
        </section>

        <!-- 3. Блок одной заявки -->
        <section id="admin-lead-detail" class="admin-block admin-hidden">
            <div class="admin-detail-header">
                <button type="button" id="admin-detail-back" class="admin-btn admin-btn--secondary">Назад к списку</button>
                <h1>Заявка</h1>
            </div>
            <p id="admin-detail-loading" class="admin-loading">Загрузка…</p>
            <div class="admin-detail-section">
                <h2>Данные заявки</h2>
                <div id="admin-detail-payload" class="admin-detail-payload"></div>
            </div>
            <div class="admin-detail-section">
                <h2>Согласия</h2>
                <div id="admin-detail-consents"></div>
            </div>
        </section>

        <!-- 4. Блок настроек -->
        <section id="admin-settings" class="admin-block admin-hidden">
            <div class="admin-settings-header">
                <h1>Настройки</h1>
            </div>

            <div class="admin-settings-card">
                <h2>Уведомления о заявках</h2>
                <p class="admin-settings-hint">На эти адреса приходит письмо при каждой новой заявке с сайта.</p>
                <ul id="admin-email-list" class="admin-email-list" aria-live="polite"></ul>
                <div class="admin-email-add">
                    <label for="admin-email-input" class="visually-hidden">Email получателя</label>
                    <input type="email" id="admin-email-input" class="form-input admin-settings-input" placeholder="email@example.com" autocomplete="email">
                    <button type="button" id="admin-email-add" class="admin-btn admin-btn--secondary admin-btn--small">Добавить</button>
                </div>
                <button type="button" id="admin-settings-save" class="admin-btn admin-btn--primary">Сохранить</button>
                <div id="admin-settings-message" class="form-message" role="alert" aria-live="polite"></div>
            </div>

            <div class="admin-settings-card">
                <h2>Аккаунт</h2>
                <p class="admin-settings-account">Email: <strong id="admin-me-email">—</strong></p>
            </div>

            <div class="admin-settings-card">
                <h2>Смена пароля</h2>
                <form id="admin-password-form" class="admin-settings-form">
                    <div class="form-group">
                        <label for="admin-current-password">Текущий пароль</label>
                        <input type="password" id="admin-current-password" class="form-input admin-settings-input" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="admin-new-password">Новый пароль</label>
                        <input type="password" id="admin-new-password" class="form-input admin-settings-input" required autocomplete="new-password" minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="admin-confirm-password">Подтверждение пароля</label>
                        <input type="password" id="admin-confirm-password" class="form-input admin-settings-input" required autocomplete="new-password" minlength="8">
                    </div>
                    <button type="submit" class="admin-btn admin-btn--primary">Изменить пароль</button>
                    <div id="admin-password-message" class="form-message" role="alert" aria-live="polite"></div>
                </form>
            </div>
        </section>
    </div>
    <script src="js/admin.js?v=2"></script>
</body>
</html>
