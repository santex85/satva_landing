<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Satva</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">
    <div class="admin-container">
        <!-- 1. Блок входа -->
        <section id="admin-login" class="admin-block">
            <h1>Вход в админку</h1>
            <form id="admin-login-form" class="admin-login-form">
                <div class="form-group">
                    <label for="admin-email">Email</label>
                    <input type="email" id="admin-email" name="email" class="form-input" required autocomplete="email" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label for="admin-password">Пароль</label>
                    <input type="password" id="admin-password" name="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Войти</button>
                <div id="admin-login-message" class="form-message" role="alert" aria-live="polite"></div>
            </form>
        </section>

        <!-- 2. Блок списка заявок -->
        <section id="admin-leads" class="admin-block admin-hidden">
            <div class="admin-leads-header">
                <h1>Заявки</h1>
                <div class="admin-toolbar">
                    <label for="admin-leads-filter" class="visually-hidden">Фильтр по типу</label>
                    <select id="admin-leads-filter" class="admin-filter-select" aria-label="Фильтр по типу заявки">
                        <option value="">Все</option>
                        <option value="contact">contact</option>
                    </select>
                    <button type="button" id="admin-logout" class="admin-btn admin-btn--secondary">Выйти</button>
                </div>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table" role="grid" aria-label="Список заявок">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Тип</th>
                            <th>Имя</th>
                            <th>Телефон</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="admin-leads-tbody">
                        <tr><td colspan="5">Загрузка…</td></tr>
                    </tbody>
                </table>
            </div>
            <nav class="admin-pagination" aria-label="Пагинация">
                <button type="button" id="admin-pagination-prev" class="admin-btn admin-btn--secondary">Назад</button>
                <span id="admin-pagination-info" aria-live="polite">—</span>
                <button type="button" id="admin-pagination-next" class="admin-btn admin-btn--secondary">Вперёд</button>
            </nav>
        </section>

        <!-- 3. Блок одной заявки -->
        <section id="admin-lead-detail" class="admin-block admin-hidden">
            <div class="admin-detail-header">
                <button type="button" id="admin-detail-back" class="admin-btn admin-btn--secondary">Назад к списку</button>
                <h1>Заявка</h1>
            </div>
            <p id="admin-detail-loading" class="admin-loading">Загрузка…</p>
            <div class="admin-detail-section">
                <h2>Данные заявки</h2>
                <div id="admin-detail-payload" class="admin-detail-payload"></div>
            </div>
            <div class="admin-detail-section">
                <h2>Согласия</h2>
                <div id="admin-detail-consents"></div>
            </div>
        </section>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
