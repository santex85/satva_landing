server {
    server_name satvasamui.com www.satvasamui.com;

    root /var/www/satva-landing/frontend;
    index index.html;

    client_max_body_size 10M;

    access_log /var/log/nginx/satvasamui_com_access.log;
    error_log /var/log/nginx/satvasamui_com_error.log;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        text/plain
        text/xml
        application/xml;

    # /yoga → yoga.html
    location = /yoga {
        rewrite ^ /yoga.html last;
    }

    # Партнёрские лендинги
    location = /partners {
        return 301 /partners/;
    }
    location /partners/ {
        try_files $uri $uri/ /partners/index.html;
    }

    location = /oferta.html {
        return 301 https://satvasamui.ru/oferta.html;
    }

    # Русская версия переехала на satvasamui.ru — 301 со снятием префикса /ru
    location = /ru {
        return 301 https://satvasamui.ru/;
    }
    location ^~ /ru/ {
        rewrite ^/ru/(.*)$ https://satvasamui.ru/$1 permanent;
    }

    # Админка — только по секретному пути (не /admin.html)
    location = /admin.html {
        return 404;
    }
    location = /admin {
        return 404;
    }
    location = /samui-ctl-x7f2.html {
        return 404;
    }
    location = /samui-ctl-x7f2 {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /samui-ctl-x7f2.html =404;
    }

    # API (Docker: 127.0.0.1:9080 -> app:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|ttf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on default_server; # managed by Certbot
    listen 443 ssl default_server; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/satvasamui.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/satvasamui.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.satvasamui.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = satvasamui.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name satvasamui.com www.satvasamui.com;
    return 404; # managed by Certbot
}
