server {
    server_name satvasamui.site www.satvasamui.site;

    root /var/www/satva-landing/frontend;
    index index.html;

    client_max_body_size 10M;

    access_log /var/log/nginx/satvasamui_access.log;
    error_log /var/log/nginx/satvasamui_error.log;

    # /yoga → yoga.html
    location = /yoga {
        rewrite ^ /yoga.html last;
    }

    # Админка — только по секретному пути (не /admin.html)
    location = /admin.html {
        return 404;
    }
    location = /admin {
        return 404;
    }
    location = /samui-ctl-x7f2.html {
        return 404;
    }
    location = /samui-ctl-x7f2 {
        try_files /samui-ctl-x7f2.html =404;
    }

    # API (Docker: 127.0.0.1:9080 -> app:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|ttf|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/satvasamui.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/satvasamui.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name satvasamui.site www.satvasamui.site;
    return 301 https://$host$request_uri;
}
