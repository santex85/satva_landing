server {
    server_name satvasamui.ru www.satvasamui.ru;

    root /var/www/satva-landing/frontend;
    index index.html;

    client_max_body_size 10M;

    access_log /var/log/nginx/satvasamui_ru_access.log;
    error_log /var/log/nginx/satvasamui_ru_error.log;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        text/plain
        text/xml
        application/xml;

    # Общие ассеты: напрямую из корня frontend (не из /ru)
    location ~* ^/(img|css|js|video|assets)/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /favicon.png {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SEO-файлы для .ru (явно, до общего location /)
    location = /robots.txt {
        try_files /ru/robots.txt =404;
    }
    location = /sitemap.xml {
        try_files /ru/sitemap.xml =404;
        add_header Content-Type application/xml;
    }

    # API на .ru нет — редирект на .com
    location /api/ {
        return 301 https://satvasamui.com$request_uri;
    }

    # Админка и секретный путь закрыты
    location = /admin.html {
        return 404;
    }
    location = /admin {
        return 404;
    }
    location = /samui-ctl-x7f2.html {
        return 404;
    }
    location = /samui-ctl-x7f2 {
        return 404;
    }

    # Запрет дублей satvasamui.ru/ru/...
    location = /ru {
        return 301 /;
    }
    location ^~ /ru/ {
        rewrite ^/ru/(.*)$ /$1 permanent;
    }

    # Партнёрский лендинг: satvasamui.ru/partners/ -> frontend/ru/partners/
    location = /partners {
        return 301 /partners/;
    }
    location /partners/ {
        try_files /ru$uri /ru$uri/ /ru/partners/index.html;
    }

    # Всё остальное маппим в /ru/
    location / {
        try_files /ru$uri /ru$uri/ /ru/index.html;
    }

    # HTML не кэшируем в браузере
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    listen 80;
    listen [::]:80;
}
