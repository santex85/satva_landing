server {
    if ($host = www.satvasamui.ru) {
        return 301 https://satvasamui.ru$request_uri;
    }

    server_name satvasamui.ru www.satvasamui.ru;

    root /var/www/satva-landing/frontend;
    index index.html;
    add_header Cache-Control "no-cache" always;

    client_max_body_size 10M;

    access_log /var/log/nginx/satvasamui_ru_access.log;
    error_log /var/log/nginx/satvasamui_ru_error.log;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        text/plain
        text/xml
        application/xml;

    # Общие ассеты: напрямую из корня frontend (не из /ru)
    location ~* ^/(img|css|js|video|assets)/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /favicon.png {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SEO-файлы для .ru (явно, до общего location /)
    location = /robots.txt {
        try_files /ru/robots.txt =404;
    }
    location = /sitemap.xml {
        try_files /ru/sitemap.xml =404;
        add_header Content-Type application/xml;
    }
    location = /llms.txt {
        try_files /llms.txt =404;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # API на .ru нет — редирект на .com
    location /api/ {
        return 301 https://satvasamui.com$request_uri;
    }

    # Админка и секретный путь закрыты
    location = /admin.html {
        return 404;
    }
    location = /admin {
        return 404;
    }
    location = /samui-ctl-x7f2.html {
        return 404;
    }
    location = /samui-ctl-x7f2 {
        return 404;
    }
    location = /terms.html {
        return 301 /oferta.html;
    }

    # Запрет дублей satvasamui.ru/ru/...
    location = /ru {
        return 301 /;
    }
    location ^~ /ru/ {
        rewrite ^/ru/(.*)$ /$1 permanent;
    }

    # Партнёрский лендинг: satvasamui.ru/partners/ -> frontend/ru/partners/
    location = /partners {
        return 301 /partners/;
    }
    location = /partners/ {
        root /var/www/satva-landing/frontend;
        try_files /ru/partners/index.html =404;
    }
    location /partners/ {
        root /var/www/satva-landing/frontend;
        try_files /ru$uri =404;
    }

    # Главная — явно, без try_files на каталог /ru/ (иначе 301 → /index.html)
    location = / {
        root /var/www/satva-landing/frontend;
        try_files /ru/index.html =404;
    }

    # Остальные страницы: файл в /ru/, иначе SPA-fallback
    location / {
        root /var/www/satva-landing/frontend;
        try_files /ru$uri @ru_fallback;
    }
    location @ru_fallback {
        root /var/www/satva-landing/frontend;
        try_files /ru/index.html =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.satvasamui.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.satvasamui.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.satvasamui.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = satvasamui.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name satvasamui.ru www.satvasamui.ru;
    return 404; # managed by Certbot
}
