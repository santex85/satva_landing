# Конфиг nginx для docker-compose.yml (локальная разработка).
# Отличие от nginx.conf: CSS/JS без долгого immutable-кэша — после make build-all видны новые стили.

server {
    listen 80;
    server_name localhost;
    root /var/www/static;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css text/plain text/xml
        application/javascript application/json application/xml+rss
        image/svg+xml;
    gzip_vary on;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /yoga {
        rewrite ^ /yoga.html last;
    }

    location = /partners {
        return 301 /partners/;
    }
    location /partners/ {
        try_files $uri $uri/ /partners/index.html;
    }

    location = /ru {
        return 301 /ru/;
    }
    location = /ru/partners {
        return 301 /ru/partners/;
    }
    location /ru/partners/ {
        try_files $uri $uri/ /ru/partners/index.html;
    }
    location /ru/ {
        try_files $uri $uri/ /ru/index.html;
    }

    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(jpg|jpeg|png|webp|svg|woff2|mp4|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
