server {
    listen 80;
    server_name localhost;
    root /var/www/static;
    index index.html;

    # Brotli: в официальном nginx:alpine нет ngx_brotli; при смене образа — раскомментировать/добавить.

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css text/plain text/xml
        application/javascript application/json application/xml+rss
        image/svg+xml;
    gzip_vary on;

    location /api/ {
        # Docker DNS: без resolver nginx кэширует IP app при recreate контейнера → 502
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app app;
        proxy_pass http://$upstream_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Чистый URL /yoga → yoga.html (лендинг йога-тура)
    location = /yoga {
        rewrite ^ /yoga.html last;
    }

    # Русская версия лендинга
    location = /ru {
        return 301 /ru/;
    }
    location /ru/ {
        try_files $uri $uri/ /ru/index.html;
    }

    # Админка — только по секретному пути (не /admin.html)
    location = /admin.html {
        return 404;
    }
    location = /admin {
        return 404;
    }
    location = /samui-ctl-x7f2.html {
        return 404;
    }
    location = /samui-ctl-x7f2 {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /samui-ctl-x7f2.html =404;
    }

    # Кэш версионируемой статики (релиз = новый деплой)
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|woff2|mp4|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # HTML: не кэшировать в браузере (обновления без query-string)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
